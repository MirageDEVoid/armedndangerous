plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

import java.time.LocalDate
import java.time.temporal.IsoFields

def indexToSuffix(int index) {
    def letters = ""
    index++
    while (index > 0) {
        index--
        letters = String.valueOf((char)(('a' as char) + (index % 26))) + letters
        index = (int)(index / 26)
    }
    return letters
}

def generateSnapshotVersion() {
    def now = LocalDate.now()
    def year = String.format("%02d", now.year % 100)
    def week = String.format("%02d", now.get(IsoFields.WEEK_OF_WEEK_BASED_YEAR))

    def counterFile = file("$rootDir/.gradle/snapshot_counter.properties")
    def props = new Properties()
    def currentWeekKey = "${year}w${week}"

    if (counterFile.exists()) {
        counterFile.withInputStream { props.load(it) }
    }

    def lastWeek = props.getProperty("last_week", "")
    def letterIndex = lastWeek == currentWeekKey
            ? (props.getProperty("letter_index", "0") as int) + 1
            : 0

    props.setProperty("last_week", currentWeekKey)
    props.setProperty("letter_index", letterIndex.toString())
    counterFile.parentFile.mkdirs()
    counterFile.withOutputStream { props.store(it, null) }

    return "${year}w${week}${indexToSuffix(letterIndex)}"
}

def isReleaseBuild = gradle.startParameter.taskNames.any { it.equalsIgnoreCase("buildRelease") }

def modVersion = isReleaseBuild
        ? (project.findProperty("mod_version") ?: { throw new GradleException("mod_version not set in gradle.properties") }())
        : generateSnapshotVersion()

version = modVersion

// Snapshot: build + deploy straight to Prism
task deployToInstance(type: Copy) {
    dependsOn build
    from jar
    into "C:/Users/admin/AppData/Roaming/PrismLauncher/instances/Exceptionally Optimized/minecraft/mods"

    doFirst {
        delete fileTree(destinationDir).matching {
            include "and-*.jar"
        }
    }

    doLast {
        println "Snapshot deployed: ${modVersion}"
    }
}

// Release: build only, output stays in build/libs
task buildRelease {
    dependsOn build

    doLast {
        println "========================================="
        println " Release built: ${modVersion}"
        println " Output: ${jar.archiveFile.get().asFile}"
        println "========================================="
    }
}

group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        url = "https://www.cursemaven.com"
    }
    maven {
        url 'https://repo.spongepowered.org/maven/'
    }
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }

}

mixin {
    add sourceSets.main, "and.refmap.json"
    config "and.mixins.json"
}

dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.4.10"

    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.5.5'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.5'

    implementation 'io.github.llamalad7:mixinextras-forge:0.5.5'
    implementation fg.deobf("curse.maven:framework-549225:7573740")
    implementation fg.deobf("curse.maven:just-enough-guns-820727:8552239")
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:4.8.4")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,
                             version             : modVersion]  // add this

    inputs.properties replaceProperties
    inputs.property "version", modVersion

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
